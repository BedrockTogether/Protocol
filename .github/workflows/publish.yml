name: Publish to GitHub Packages

# Builds the Maven reactor with JDK 8 and deploys every module
# (com.nukkitx.protocol:common + all bedrock-vXXX) to this repo's
# GitHub Packages Maven registry. Tests are skipped by design.
#
# Consumers add the registry as a Maven/Gradle repo:
#   https://maven.pkg.github.com/BedrockTogether/Protocol
# authenticated with a GitHub token that has read:packages.

on:
  push:
    branches: [remove-lambda]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and deploy to GitHub Packages
        run: mvn -B -e -DskipTests clean deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
